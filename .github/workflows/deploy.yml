name: Deploy

# Streamlit Community Cloud watches this repo's `main` branch directly and
# redeploys the live app on every push there — no deploy step needed here.
# This workflow is the gate in front of that: it runs the test suite on
# every push/PR, so a broken change never becomes what's live at the URL.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        # `-m pytest` (not the bare `pytest` command) runs it as a module, which
        # adds the current directory (repo root) to sys.path — that's what
        # lets `tests/test_pii.py` do `from pii import scrub_pii` and find the
        # top-level pii.py. Plain `pytest` doesn't add it and fails to import.
        run: python -m pytest -q tests
